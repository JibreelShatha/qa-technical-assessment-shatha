name: Cypress E2E Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  CYPRESS_LOGIN_EMAIL: ${{ secrets.CYPRESS_LOGIN_EMAIL }}
  CYPRESS_LOGIN_PASSWORD: ${{ secrets.CYPRESS_LOGIN_PASSWORD }}
  CYPRESS_LOGIN_USERNAME: ${{ secrets.CYPRESS_LOGIN_USERNAME }}

jobs:
  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run typecheck
        run: npm run typecheck

  api-tests:
    name: API Tests
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run API tests
        run: npx cypress run --env TAGS='@api and not @ignore and not @skip'

      - name: Upload mochawesome JSON (api)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mochawesome-api
          path: cypress/reports/mochawesome/*.json
          retention-days: 7

  smoke-tests:
    name: Smoke Tests
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run smoke tests
        run: npx cypress run --env TAGS='@smoke and not @ignore and not @skip'

      - name: Upload mochawesome JSON (smoke)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mochawesome-smoke
          path: cypress/reports/mochawesome/*.json
          retention-days: 7

  full-suite:
    name: Full Test Suite
    runs-on: ubuntu-latest
    needs: smoke-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run all tests (chrome)
        run: npx cypress run --browser chrome --env TAGS='not @ignore and not @skip'

      - name: Upload mochawesome JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mochawesome-full-suite
          path: cypress/reports/mochawesome/*.json
          retention-days: 7

  mobile-smoke:
    name: Mobile Smoke Tests
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run smoke tests (mobile viewport)
        run: npx cypress run --env TAGS='@smoke and not @ignore and not @skip',device=iphone

      - name: Upload mochawesome JSON (mobile)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mochawesome-mobile
          path: cypress/reports/mochawesome/*.json
          retention-days: 7

  generate-report:
    name: Generate Mochawesome Report
    runs-on: ubuntu-latest
    needs: [api-tests, smoke-tests, full-suite, mobile-smoke]
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download all mochawesome artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: mochawesome-*
          path: cypress/reports/mochawesome
          merge-multiple: true

      - name: Merge and generate HTML report
        run: npm run report

      - name: Upload final HTML report
        uses: actions/upload-artifact@v4
        with:
          name: mochawesome-html-report
          path: cypress/reports/mochawesome/report.html
          retention-days: 30
